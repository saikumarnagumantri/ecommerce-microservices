services:
  redis:
    image: redis:latest
    ports:
      - "${REDIS_PORT:-6379}:6379"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salescart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salescart}
      POSTGRES_DB: ${POSTGRES_DB:-salescart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
